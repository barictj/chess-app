name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run auth tests
        run: npm run test:auth

      - name: Run lint
        run: npm run lint

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/chess-app-export
